name: CI

# DECISIONS #26. One job per toolchain: Node owns the client, Python owns the
# pipeline. The job ids `client` and `pipeline` are the check names the
# ruleset on `next` requires - renaming either one un-gates the branch.
on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest tests/
      # The frozen year's derived file is a fresh build of its committed inputs (DECISIONS #42, #46).
      - run: python events_v2.py --season data/2026/season.json --check
      # And a live year's, once a run past its ids stage has committed one (#42, #44).
      - if: hashFiles('data/2027/events.v2.json') != ''
        run: python events_v2.py --season data/2027/season.json --check
