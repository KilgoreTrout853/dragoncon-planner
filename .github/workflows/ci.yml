name: CI

# DECISIONS #26. One job per toolchain: Node owns the client, Python owns the
# pipeline, and SQL the database (#52); a fourth, `browser`, runs the client
# in real browsers (#81). The job ids `client`, `pipeline` and `database` are
# the check names the ruleset on `next` requires - renaming any one un-gates
# the branch - and `browser` is one of them once it is added there by hand.
on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest tests/
      # The frozen year's derived file is a fresh build of its committed inputs (DECISIONS #42, #46).
      - run: python events_v2.py --season data/2026/season.json --check
      # And a live year's, once a run past its ids stage has committed one (#42, #44).
      - if: hashFiles('data/2027/events.v2.json') != ''
        run: python events_v2.py --season data/2027/season.json --check

  # The schema's row-level security, helpers, triggers and RPCs, tested with
  # pgTAP against a local database (#52; docs/sync/contract.md, section 3). The
  # Supabase CLI is supabase/'s own pinned dev dependency, never the root's; the
  # database runs in Docker, which GitHub's Ubuntu runners have running.
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: supabase/package-lock.json

      - run: npm ci --prefix supabase
      # The database alone: the migrations and the seed applied.
      - run: npm --prefix supabase run start
      - run: npm --prefix supabase test

  # The built page in Chromium and in WebKit, by Playwright (#81). The engines
  # - Chromium's headless shell, and WebKit - are kept in a cache keyed by the
  # Playwright version, so a moved pin fetches its own; the system libraries
  # they need come by apt at every run. test:browser builds the page for
  # itself. A failed run keeps its report, the traces in it.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.engines.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium webkit
      - run: npx playwright install-deps chromium webkit

      - run: npm run test:browser

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
