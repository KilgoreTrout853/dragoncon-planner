name: Scrape

# The 2027 pipeline (DECISIONS #44, #48; docs/pipeline/contract.md, The run, as built): hourly inside the season
# window, and by hand with `force` past it. pipeline.py decides what a run does and writes; this file lands it. A run
# that changed a committed file commits to a schedule/ branch off the target, opens a pull request into the target,
# closes the bot's older ones, and turns on auto-merge, so CI gates it as it gates every change (#26). A run that
# changed nothing, or a fatal one, commits nothing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run outside the season window (nothing overrides a fatal rule)
        type: boolean
        default: false
      to:
        description: Stop after fetch, ids or tag (refused once the year's events.v2.json exists); empty runs every stage
        type: string
        default: ""
      limit:
        description: Only the first N listings, in page order; empty takes every listing
        type: string
        default: ""
      requests:
        description: The tag stage's request cap for this run; empty takes the season's
        type: string
        default: ""
      season:
        description: The season file
        type: string
        default: data/2027/season.json
      target:
        description: The branch the run starts from and lands on; empty takes the SCRAPE_TARGET variable
        type: string
        default: ""

permissions:
  contents: read

# One run at a time: a second waits for the first to land, and a third replaces a second still waiting (#48).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SEASON: ${{ inputs.season || 'data/2027/season.json' }}
      TARGET: ${{ inputs.target || vars.SCRAPE_TARGET }}
    steps:
      # A run branches afresh from the target (#48): its code and its committed files. The bot's token pushes.
      - id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target || vars.SCRAPE_TARGET }}
          token: ${{ secrets.SCHEDULE_BOT_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - id: window
        name: Season window
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "::error title=scrape::no target: set the SCRAPE_TARGET repository variable, or dispatch with one"
            exit 1
          fi
          window=$(python pipeline.py window --season "$SEASON")
          echo "$window"
          echo "window=$window" >> "$GITHUB_OUTPUT"
          if [ "$window" != "in window" ] && [ "$FORCE" != true ]; then
            echo "Outside the season window of \`$SEASON\`: nothing run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: run
        name: Run the pipeline
        if: steps.window.outputs.window == 'in window' || inputs.force
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_SHA: ${{ steps.checkout.outputs.commit }}
          FORCE: ${{ inputs.force }}
          TO: ${{ inputs.to }}
          LIMIT: ${{ inputs.limit }}
          REQUESTS: ${{ inputs.requests }}
        run: |
          args=(run --season "$SEASON")
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ -n "$REQUESTS" ]; then args+=(--requests "$REQUESTS"); fi
          python pipeline.py "${args[@]}"

      - name: Job summary
        if: always() && steps.run.outcome != 'skipped'
        run: python pipeline.py summary --format md >> "$GITHUB_STEP_SUMMARY"

      # Authored as schedule-bot with the token owner's noreply address, which GitHub attributes to that account, so
      # the rulesets' extra approval for unattributed changes does not hold the pull request.
      - name: Land by pull request
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.SCHEDULE_BOT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          stamp=$(jq -r .stamp "$(dirname "$SEASON")/last-run.json")
          branch="schedule/${stamp//:/}"
          python pipeline.py summary --format md > "$RUNNER_TEMP/summary.md"
          { echo "schedule: $stamp"; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/commit.txt"
          git config user.name schedule-bot
          git config user.email 237842455+KilgoreTrout853@users.noreply.github.com
          git switch -c "$branch"
          git add -A
          git commit --cleanup=verbatim -F "$RUNNER_TEMP/commit.txt"
          git push origin "$branch"
          url=$(gh pr create --base "$TARGET" --head "$branch" --title "schedule: $stamp" --body-file "$RUNNER_TEMP/summary.md")
          number=${url##*/}
          gh pr list --state open --base "$TARGET" --author "@me" --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"schedule/\")) | select(.number != $number) | .number" |
          while read -r old; do gh pr close "$old" --comment "Superseded by #$number." --delete-branch; done
          if [ "$TARGET" = main ]; then method=--merge; else method=--squash; fi
          gh pr merge "$number" --auto "$method"

      # A fatal run writes nothing (#44); if a failure left anything changed, say what, and fail.
      - name: A failed run leaves the tree clean
        if: failure()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff --stat
            git --no-pager diff | head -n 200 || true
            echo "::error title=scrape::the run failed and left files changed; a fatal run writes nothing (DECISIONS #44)"
            exit 1
          fi
          echo "the tree is clean"
