name: Refresh schedule

# Dragon Con 2026 is over and data/2026/events.json is the final schedule.
# This runs by hand only, from the Actions tab, and a run overwrites that
# file with whatever the host serves now - so only on purpose. The cron
# that ran it every three hours through con week is gone, not paused; put
# it back for next year, with a date guard for that year's con week.
on:
  workflow_dispatch:

permissions:
  contents: write

# Two refreshes at once - a run started by hand overlapping another - both
# rewrite the schedule, and the rebase in the push step cannot resolve that;
# it dropped a scrape on Sep 2. Queue them instead: a second run waits for
# the first to finish, and a third replaces the waiting second.
concurrency:
  group: refresh-schedule
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Scrape
        run: python scraper.py --workers 4

      - name: Refuse to commit a broken scrape
        run: |
          python - <<'PY'
          import json, subprocess, sys
          path = "data/2026/events.json"
          new = json.load(open(path, encoding="utf-8"))
          new_n = len(new["events"])
          f = new.get("failures")
          n_fail = len(f) if isinstance(f, list) else (f or 0)
          try:
              old_raw = subprocess.run(["git", "show", f"HEAD:{path}"],
                                       capture_output=True, text=True, check=True).stdout
              old_n = len(json.loads(old_raw)["events"])
          except Exception:
              old_n = 0
          print(f"previous={old_n} new={new_n} failures={n_fail}")
          if new_n == 0:
              sys.exit("Refusing to commit: scrape returned 0 events.")
          if old_n and new_n < old_n * 0.8:
              pct = 100 * (1 - new_n / old_n)
              sys.exit(f"Refusing to commit: event count fell {pct:.0f}% ({old_n} -> {new_n}). "
                       "Host is probably rate-limiting; the previous schedule is left in place.")
          PY

      - name: Commit the schedule if anything changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data/2026/events.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh schedule $(date -u +%Y-%m-%dT%H:%MZ)"
          # The scrape takes ~20 minutes, and main may well have moved while it
          # ran - a push that loses that race drops the whole refresh silently.
          # The schedule is the only file this job touches, and the concurrency
          # group keeps two refreshes from running at once, so rebasing onto
          # whatever landed meanwhile cannot conflict.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; main moved while we were scraping. Rebasing and retrying."
            git pull --rebase --no-edit origin main || {
              echo "Rebase failed - leaving main alone rather than forcing."
              exit 1
            }
            sleep 5
          done
          echo "Still could not push after three attempts."
          exit 1
