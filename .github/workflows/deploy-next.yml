name: Deploy next

# The next branch publishes to a site of its own, in a repository of its own:
# https://kilgoretrout853.github.io/dragoncon-planner-next/. main keeps
# publishing straight from the branch, as it always has, and nothing here
# touches it. A repository has one Pages site with one source, so a /next/
# path under the live site would have to be part of main's own publish; a
# sibling site leaves main alone.
#
# Pushing to another repository needs a credential of its own: a deploy key
# with write access on dragoncon-planner-next, its private half kept in this
# repository's secrets as NEXT_DEPLOY_KEY. The README has the set-up.
on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-next
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DC_CHANNEL: next          # the build-time switch: the dev-build mark, and the worker's own cache name
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the stamped copy
        run: python build.py --out site

      - name: Publish to dragoncon-planner-next
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.NEXT_DEPLOY_KEY }}
          external_repository: KilgoreTrout853/dragoncon-planner-next
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          commit_message: "next ${{ github.sha }}"
