i Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >Sizes from the hotel's tables at 2 px per foot; placement from the hotel's own floor plan, or Dragon Con's map where it has none. North is up.</text><g transform="translate(40 1200)"><rect x="0" y="0" width="100" height="6" fill="#F3EFE4"/><rect x="100" y="0" width="100" height="6" fill="#A5A9C9"/><text x="0.0" y="20.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="11" font-weight="600" fill="#A5A9C9" text-anchor="middle" >0 ft</text><text x="100.0" y="20.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="11" font-weight="600" fill="#A5A9C9" text-anchor="middle" >50 ft</text><text x="200.0" y="20.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="11" font-weight="600" fill="#A5A9C9" text-anchor="middle" >100 ft</text></g><text x="40.0" y="1250.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1250.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >301–305 are five rooms side by side, each 48 ft deep (301: 37) and 23 to 30 ft wide: the plan and the con's map both draw them so, and the</text><text x="52.0" y="1267.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >table's first figure is the depth here</text><text x="40.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >309–312 run down the north-west wing with 309 by the atrium and 312 at the far end; 313–314 face them across the conference centre</text><text x="40.0" y="1301.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1301.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >306–308 run 308, 307, 306 from west to east on the hotel's plan; Dragon Con's map labels them the other way round - to be checked in person</text><text x="40.0" y="1318.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1318.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >The Terrace is the outdoor deck south of the core</text></svg>