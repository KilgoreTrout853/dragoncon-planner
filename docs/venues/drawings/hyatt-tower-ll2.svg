els below the lobby in the International Tower, under the International Ballroom</text><text x="40.0" y="1087.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1087.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >the table's rooms do not tile the hall the plan draws: A and B are drawn from the Embassy corridor at the table's depth, about 31 ft, which</text><text x="52.0" y="1104.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >leaves them some 7 ft short of the north wall the plan draws them against</text><text x="40.0" y="1121.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1121.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >Embassy G and H are the two small rooms beside the elevators; H is the table's 27'10" x 11'6", which the plan draws a little larger</text><text x="40.0" y="1138.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1138.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >the Embassy corridor and the lobby are the plan's outlines: the corridor is drawn 12 ft deep, where the table says 10'3" wide</text><text x="40.0" y="1155.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1155.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >the escalators beside the elevators go up to the International Ballroom and down to the Conference Center</text></svg>