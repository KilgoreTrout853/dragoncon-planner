40.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >the plan draws these rooms about a fifth larger than the table says; the table's sizes are used, each row held to its window wall and its</text><text x="52.0" y="1301.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >west end</text></svg>