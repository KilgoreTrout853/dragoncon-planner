.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1284.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >Galleria 1, 2, 4 and 8 are the table's sizes; Galleria 3 is 51 x 33, the table's 51 x 91 being a misprint against its own square footage</text><text x="40.0" y="1301.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1301.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >Galleria 5, 6 and 7 are the plan's shapes: the table's 63 x 94, 63 x 49 and 64 x 49 contradict its own square footage. 6 and 7 as drawn</text><text x="52.0" y="1318.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >agree with that square footage; 5 is drawn about as wide as Galleria 4, as the plan shows it, some 30% over its 2,878 sq ft - to be checked</text><text x="52.0" y="1335.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" text-anchor="start" >in person</text><text x="40.0" y="1352.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5A9C9" text-anchor="start" >·</text><text x="52.0" y="1352.0" font-family="Barlow Semi Condensed, Avenir Next Condensed, Roboto Condensed, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A5A9C9" t