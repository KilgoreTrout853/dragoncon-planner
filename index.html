<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dragon Con 2026 planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Tokens. Color is information here: each hotel has one hue, used on
   room chips and walk warnings. Gold is reserved for "mine".
   ------------------------------------------------------------------ */
:root {
  --ink: #171A33;
  --surface: #22264A;
  --raised: #2B3060;
  --line: #3A3F70;
  --text: #F3EFE4;
  --muted: #A5A9C9;
  --dim: #6F739A;
  --gold: #F3C64B;
  --gold-ink: #2A2200;
  --warn: #FF8A7A;
  --font: "Barlow Semi Condensed", "Avenir Next Condensed", "Roboto Condensed", system-ui, sans-serif;
  --h-Marriott: #F0705D;
  --h-Hyatt: #55B7DD;
  --h-Hilton: #79D19B;
  --h-Courtland: #C797F5;
  --h-Westin: #F5A63F;
  --h-Mart: #C6DC6B;   /* yellow-green: kept clear of --gold, which means "mine" */
  --h-Hardy: #9ED5C0;
  --h-Streaming: #8F97AE;
  --h-Other: #8F97AE;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { background: var(--ink); color-scheme: dark; }
body {
  margin: 0; font-family: var(--font); font-size: 17px; line-height: 1.3;
  color: var(--text); background: var(--ink);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(76px + var(--safe-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Header ------------------------------------------------------------ */
.hdr {
  position: sticky; top: 0; z-index: 5;
  background: var(--ink); border-bottom: 1px solid var(--line);
  padding: 10px max(14px, calc(50% - 366px)) 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.hdr .brand { font-size: 13px; color: var(--muted); font-weight: 500; }
.hdr .clock { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hdr .fresh { font-size: 13px; color: var(--dim); margin-top: 2px; }
.icon-btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted);
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Notices ------------------------------------------------------------ */
.notice {
  margin: 12px 14px 0; padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 15px;
}
.notice b { color: var(--text); font-weight: 600; }
.notice.warn { border-color: var(--warn); color: var(--text); }

/* Views -------------------------------------------------------------- */
main { max-width: 760px; margin: 0 auto; }
.view { padding: 0 0 12px; }
.section-title {
  padding: 18px 14px 6px; font-size: 15px; color: var(--muted); font-weight: 600;
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.section-title .count { font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; }

/* Controls ----------------------------------------------------------- */
.controls { padding: 12px 14px 0; display: grid; gap: 10px; }
.search {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.search::placeholder { color: var(--dim); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; height: 38px; padding: 0 13px; border-radius: 19px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600; }
.chip.hotel[aria-pressed="true"] { background: var(--h); border-color: var(--h); color: var(--ink); }
.row-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { height: 40px; padding: 0 12px; background: var(--surface); color: var(--muted); border: 0; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 600; }
select.track {
  flex: 1 1 160px; min-width: 0; height: 40px; padding: 0 10px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.toggle { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; min-height: 40px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); margin: 0; }

/* Rows: a departures board. Time is loudest; the room chip carries the hotel color. */
.list { list-style: none; margin: 0; padding: 0; }
.day-head { padding: 22px 14px 4px; font-size: 20px; font-weight: 700; }
.time-head { padding: 12px 14px 2px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
.row { border-top: 1px solid var(--line); }
.row.open { background: var(--surface); }
.row.mine .title::before { content: "★ "; color: var(--gold); }
.row.cancelled .title { text-decoration: line-through; color: var(--muted); }
.row-main {
  width: 100%; display: grid; grid-template-columns: 66px 1fr; gap: 10px; text-align: left;
  background: none; border: 0; padding: 11px 0 11px 14px; align-items: start;
}
.row-line { display: grid; grid-template-columns: 1fr 56px; align-items: stretch; }
.t { font-variant-numeric: tabular-nums; line-height: 1.05; padding-top: 1px; }
.t .start { font-size: 20px; font-weight: 700; display: block; }
.t .ampm { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.t .end { display: block; font-size: 13px; color: var(--dim); margin-top: 3px; }
.body { min-width: 0; }
.title { font-size: 18px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 14px; color: var(--muted); }
.room {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 13px;
  background: color-mix(in srgb, var(--h) 18%, transparent); color: var(--h); border: 1px solid color-mix(in srgb, var(--h) 45%, transparent);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.track { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.status { color: var(--gold); font-weight: 600; }
mark { background: none; color: var(--gold); font-weight: 700; }
.t .day { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 1px; letter-spacing: .02em; }
.snippet { margin-top: 5px; font-size: 14px; color: var(--muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); color: var(--text); }
.tag.adult { color: var(--warn); }
.star {
  background: none; border: 0; color: var(--dim); font-size: 26px; line-height: 1; display: grid; place-items: center; padding: 0 8px 0 0;
}
.star[aria-pressed="true"] { color: var(--gold); }
.detail { padding: 0 14px 14px 90px; color: var(--muted); font-size: 16px; display: grid; gap: 10px; }
.detail p { margin: 0; white-space: pre-line; color: var(--text); }
.detail .kv { display: grid; gap: 3px; font-size: 15px; }
.detail .kv span { color: var(--text); }
.btn {
  height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 16px;
  background: var(--gold); color: var(--gold-ink); border: 0;
}
.btn.quiet { background: var(--raised); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
.detail .btn { justify-self: start; }
.gap {
  margin: 0 14px 0 80px; padding: 6px 10px; font-size: 14px; border-left: 3px solid var(--line); color: var(--muted);
}
.gap.tight { border-color: var(--warn); color: var(--text); }
.gap.overlap { border-color: var(--warn); color: var(--warn); font-weight: 600; }
.empty { padding: 28px 14px; color: var(--muted); font-size: 16px; }
.empty b { color: var(--text); }
.more { margin: 14px; }
.mine-actions { padding: 12px 14px 0; display: flex; gap: 8px; flex-wrap: wrap; }

/* Bottom nav -------------------------------------------------------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--ink); border-top: 1px solid var(--line);
  padding: 6px max(8px, calc(50% - 372px)) calc(6px + var(--safe-bottom));
}
.nav button {
  height: 58px; border: 0; background: none; color: var(--dim); border-radius: 12px;
  display: grid; place-items: center; gap: 2px; font-weight: 600; font-size: 14px;
}
.nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--text); background: var(--surface); }
.nav .badge { position: absolute; margin-left: 40px; margin-top: -34px; background: var(--gold); color: var(--gold-ink); border-radius: 10px; font-size: 12px; padding: 1px 6px; font-weight: 700; }

/* Settings sheet ---------------------------------------------------- */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 760px; margin: 0 auto;
  background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 16px 16px calc(20px + var(--safe-bottom)); display: grid; gap: 16px;
}
.sheet h2 { margin: 0; font-size: 20px; }
.sheet label { display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.sheet input[type="range"] { width: 100%; accent-color: var(--gold); }
.sheet select { height: 44px; padding: 0 10px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line); color: var(--text); font: inherit; }
.sheet input[type="datetime-local"] { height: 44px; padding: 0 10px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line); color: var(--text); }
.sheet .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.walk-table { font-size: 14px; color: var(--muted); }
.walk-table td { padding: 2px 6px 2px 0; }

/* Bottom sheet: one wrapper, two panels (settings, event) */
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -4px auto 0; flex: none; }
.sheet-panel { display: grid; gap: 16px; }
.sheet-panel[hidden] { display: none; }
.ev-head { display: grid; gap: 6px; }
.ev-head h2 { margin: 0; font-size: 21px; line-height: 1.25; }
.ev-when { color: var(--muted); font-size: 15px; }
.ev-room { font-size: 19px; font-weight: 700; color: var(--h); line-height: 1.2; }
.ev-body { display: grid; gap: 12px; max-height: 48vh; overflow-y: auto; overscroll-behavior: contain; }
.ev-body p { margin: 0; white-space: pre-line; font-size: 16px; }
.ev-people { color: var(--muted); font-size: 15px; }
.ev-people span { color: var(--text); }
.ev-actions { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.ev-actions .btn { flex: 1 1 auto; }
.ev-star {
  font-size: 24px; line-height: 1; width: 56px; flex: none; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
}
.ev-star[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }

/* Hero card: the next thing you have to act on */
.hero {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
  padding: 14px; background: var(--surface); border: 0; border-bottom: 1px solid var(--line);
  color: var(--text); font: inherit; cursor: pointer;
}
.hero .ring { flex: none; position: relative; width: 62px; height: 62px; }
.hero .ring svg { transform: rotate(-90deg); display: block; }
.hero .ring .track-c { stroke: var(--line); }
.hero .ring .prog { stroke: var(--gold); transition: stroke-dashoffset .6s linear; }
.hero.late .ring .prog { stroke: var(--warn); }
.hero .ring .num {
  position: absolute; inset: 0; display: grid; place-items: center; line-height: 1;
  font-size: 17px; font-weight: 700; color: var(--gold);
}
.hero.late .ring .num { color: var(--warn); }
.hero .ring .num small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
.hero .hbody { display: grid; gap: 5px; min-width: 0; flex: 1; }
.hero .hkicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero .htitle { font-size: 19px; font-weight: 700; line-height: 1.2; }
.hero .hroom { font-size: 15px; font-weight: 700; color: var(--h); }
.hero .hleave { font-size: 15px; font-weight: 700; color: var(--gold); }
.hero.late .hleave { color: var(--warn); }
.hero .hthen { font-size: 13px; color: var(--muted); }
.hero .hthen b { color: var(--text); font-weight: 700; }
.list.compact .row-main { padding-top: 8px; padding-bottom: 8px; }
.list.compact .snippet { display: none; }
@media (prefers-reduced-motion: reduce) { .hero .ring .prog { transition: none; } }

/* Sticky next-up bar: what's next while you're browsing something else */
.minibar {
  position: fixed; left: 0; right: 0; bottom: calc(70px + var(--safe-bottom)); z-index: 6;
  height: 48px; box-sizing: border-box; width: 100%; border: 0;
  padding: 0 max(14px, calc(50% - 366px)); font: inherit; color: var(--text); text-align: left;
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.minibar .mb-body { display: grid; gap: 1px; min-width: 0; flex: 1; }
.minibar .mb-title { font-size: 14px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar .mb-room { font-size: 12px; font-weight: 700; color: var(--h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar .mb-when { flex: none; font-size: 14px; font-weight: 700; color: var(--gold); }
.minibar.late .mb-when { color: var(--warn); }
body.has-minibar { padding-bottom: calc(124px + var(--safe-bottom)); }

/* Schematic venue map. Not to scale: it exists to answer "which way, roughly". */
.venue-map { width: 100%; height: auto; display: block; }
.venue-map .blk { cursor: pointer; }
.venue-map .blk rect { fill: var(--h); fill-opacity: .18; stroke: var(--h); stroke-width: 1.5; }
.venue-map .blk text { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.venue-map .blk.on rect { fill-opacity: .92; }
.venue-map .blk.on text { fill: var(--ink); }
.venue-map .blk.dim rect { fill-opacity: .07; stroke-opacity: .35; }
.venue-map .blk.dim text { fill: var(--dim); }
.venue-map .link { stroke: var(--gold); stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
.venue-map .link-label {
  fill: var(--gold); font-size: 12px; font-weight: 700; text-anchor: middle;
  /* the connector crosses other blocks, so the label needs its own backing */
  stroke: var(--surface); stroke-width: 3.5; paint-order: stroke fill; stroke-linejoin: round;
}
.venue-map .blk:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
.hero-map { padding: 0 14px 10px; background: var(--surface); }
.hero-map .venue-map { max-width: 320px; margin: 0 auto; }
.hero-loc {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 0 14px 12px; font-size: 13px; color: var(--muted);
}
.hero-loc b { color: var(--text); }
.hero-loc button { background: none; border: 0; color: var(--gold); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
.browse-map { padding: 2px 0 4px; }
.browse-map .venue-map { max-width: 340px; }

/* Timeline: the day as a column, so gaps and clashes have a shape */
.view-toggle { display: flex; gap: 6px; padding: 0 14px 10px; }
.view-toggle button {
  flex: 1; height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer;
}
.view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--gold); }
.tl-day { padding: 0 14px 22px; }
.tl-grid { position: relative; margin-left: 46px; }
.tl-hour { position: absolute; left: -46px; right: 0; height: 0; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: 0; top: -8px; font-size: 12px; color: var(--dim); width: 42px; }
.tl-block {
  position: absolute; overflow: hidden; border-radius: 8px; cursor: pointer; text-align: left;
  background: var(--h); border: 0; padding: 5px 7px; color: var(--ink); font: inherit;
  display: grid; align-content: start; gap: 1px;
}
.tl-block .tb-title { font-size: 13px; font-weight: 700; line-height: 1.15; }
.tl-block .tb-room { font-size: 11px; font-weight: 600; opacity: .8; }
.tl-now { position: absolute; left: -46px; right: 0; height: 0; border-top: 2px solid var(--warn); z-index: 3; }
.tl-now::after {
  content: "now"; position: absolute; left: 0; top: -8px; font-size: 11px; font-weight: 700;
  color: var(--warn); background: var(--ink); padding-right: 4px;
}
.tl-link { position: absolute; z-index: 2; pointer-events: none; border-left: 2px dashed var(--muted); }
.tl-link span {
  /* right-aligned: block titles run from the left, so a badge pinned right
     clears them even when two picks are back to back with no gap to sit in */
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%); white-space: nowrap;
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}
.tl-link.tight { border-left-color: var(--warn); }
.tl-link.tight span { color: var(--warn); }
</style>
</head>
<body>

<header class="hdr">
  <div>
    <div class="brand">Dragon Con 2026</div>
    <div class="clock" id="clock">…</div>
    <div class="fresh" id="fresh"></div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section class="view" id="view-now"></section>
  <section class="view" id="view-browse" hidden></section>
  <section class="view" id="view-mine" hidden></section>
</main>

<button class="minibar" id="minibar" hidden></button>

<nav class="nav" aria-label="Sections">
  <button data-tab="now" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now
  </button>
  <button data-tab="browse">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Browse
  </button>
  <button data-tab="mine" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Mine
    <span class="badge" id="mineBadge" hidden>0</span>
  </button>
</nav>

<div id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle" id="sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-panel" id="panel-settings">
    <h2 id="sheetTitle">Settings</h2>
    <label>Crowd factor for walk estimates: <b id="crowdLabel"></b>
      <input type="range" id="crowd" min="1" max="2.5" step="0.1">
    </label>

      <button class="btn danger" id="resetPicks">Remove all picks</button>
      <button class="btn" id="closeSheet">Done</button>
    </div>
    </div>
    <div class="sheet-panel" id="panel-event" hidden></div>

};

];
const STOPWORDS = new Set(["a","an","the","and","or","of","in","on","at","to","for","with","from","by","is","are","be","stuff","things","thing","something","anything","some","any","my","me","i","about","into","all"]);
const KIND_LABELS = {qa: "Celebrity Q&A", panel: "Fan panel", screening: "Screening", workshop: "Workshop", signing: "Signing", photo: "Photo op", contest: "Contest", performance: "Performance", party: "Party", gaming: "Gaming", reading: "Reading", tour: "Tour", other: "Other"};
let index = null;
const processTerm = (term) => {
  const t = term.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return t.length < 2 || STOPWORDS.has(t) ? null : t;
};
function aliasesFor(ev, text) {
  const out = [];
  for (const g of SYNONYMS) if (g.some(m => text.includes(m))) out.push(...g);
  return out.join(" ");
}

const settings = loadJSON("dc26.settings", {crowd: 1.3, hideNoise: true, homeBase: ""});
let picks = new Set(loadJSON("dc26.picks", []));
let events = [], byId = new Map(), tracks = [], hotels = [];
let meta = {};
const state = {
  tab: "now", sheetId: null, mineView: loadJSON("dc26.mineView", "timeline"),
  now: {hotel: "All", limit: 80},
  browse: {q: "", day: null, prevDay: null, hotel: "All", type: "All", track: "All", fandom: "All", kind: "All", hideAdult: false, hideNoise: settings.hideNoise, page: 1},
};
const PAGE = 150;

/* ==================================================================
   Helpers
   ================================================================== */
function loadJSON(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
function savePicks() { saveJSON("dc26.picks", [...picks]); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const toDate = iso => new Date(iso);              // "2026-09-05T11:30" parses as local time
function fmt(d) { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return {t: `${h}:${pad(m)}`, ap}; }
function fmtShort(d) { const f = fmt(d); return `${f.t} ${f.ap}`; }
function minutesBetween(a, b) { return Math.round((b - a) / 60000); }
function walkMin(a, b) {
  if (!a || !b || a === "Streaming" || b === "Streaming") return 0;
  if (a === b) return Math.round(5 * settings.crowd);
  const base = WALK[`${a}|${b}`] ?? WALK[`${b}|${a}`] ?? 12;
  return Math.round(base * settings.crowd);
}
const hotelShort = h => HOTEL_SHORT[h] || h;
const hotelVar = h => `--h-${HOTEL_VAR[h] || "Other"}`;

/* Real clock, or a preview time via #now=2026-09-05T14:00 */
function getNow() {
  const m = location.hash.match(/now=([0-9T:-]+)/);
  if (m) { const d = new Date(m[1]); if (!isNaN(d)) return d; }
  return new Date();
}
function dayOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

/* ==================================================================
   Loading
   ================================================================== */
async function load() {
  let data = window.DC_EVENTS;
  if (!data) {
    try {
      const r = await fetch("events.json", {cache: "no-cache"});
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
    } catch (e) {
      document.getElementById("view-now").innerHTML =
        `<div class="empty"><b>No schedule data yet.</b><br>events.json is missing or unreadable. Run <code>python scraper.py</code> in this folder, then reload.</div>`;
      return;
    }
  }
  meta = data;
  events = (data.events || []).filter(e => e.start).map(e => {
    const s = toDate(e.start), en = e.end ? toDate(e.end) : new Date(s.getTime() + 60 * 60000);
    const people = (e.speakers || []).map(p => p.name).join(" ");
    return {...e, _s: s, _e: en, _people: people};
  });
  events.sort((a, b) => a._s - b._s || a.title.localeCompare(b.title));
  byId = new Map(events.map(e => [e.id, e]));
  tracks = [...new Set(events.map(e => e.track).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  hotels = HOTEL_ORDER.filter(h => events.some(e => e.hotel === h));
  buildIndex();
  // Drop picks that no longer exist (cancelled/removed upstream) but keep the ids around for the notice.
  const missing = [...picks].filter(id => !byId.has(id));
  if (missing.length) { missing.forEach(id => picks.delete(id)); savePicks(); }
  updateFresh();
  render();
}

function buildIndex() {
  index = new MiniSearch({
    fields: ["title", "fandoms", "speakers", "aliases", "tracks", "kind", "topics", "description", "location"],
    storeFields: [], processTerm,
    searchOptions: {processTerm, prefix: true, fuzzy: t => t.length > 4 ? 0.2 : false, combineWith: "OR",
      boost: {title: 5, fandoms: 4, speakers: 3, aliases: 2, tracks: 2, kind: 2, topics: 2, description: 1, location: 1}},
  });
  index.addAll(events.map(e => {
    const tg = e.tags || {};
    const fandoms = (tg.fandoms || []).join(" "), topics = (tg.topics || []).join(" ");
    const kind = tg.kind ? `${tg.kind} ${KIND_LABELS[tg.kind] || ""}` : "";
    const text = [e.title, e.description, (e.tracks || []).join(" "), fandoms, topics, kind, e.location].join(" ").toLowerCase();
    return {id: e.id, title: e.title, description: e.description || "", speakers: e._people, tracks: (e.tracks || []).join(" "),
      fandoms, kind, topics, aliases: aliasesFor(e, text), location: e.location || ""};
  }));
}
function fandomCounts() {
  const m = new Map();
  events.forEach(e => (e.tags && e.tags.fandoms || []).forEach(f => m.set(f, (m.get(f) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function updateFresh() {
  const el = document.getElementById("fresh");
  if (!meta.generated_at) { el.textContent = ""; return; }
  const ago = minutesBetween(new Date(meta.generated_at), new Date());
  const changed = meta.changed_at ? minutesBetween(new Date(meta.changed_at), new Date()) : null;
  const f = m => m < 60 ? `${m} min` : m < 48 * 60 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`;
  el.textContent = `${events.length} events, refreshed ${f(ago)} ago` + (changed !== null && changed !== ago ? `, last change ${f(changed)} ago` : "");
}

/* ==================================================================
   Rendering
   ================================================================== */
function render() {
  updateClock();
  document.querySelectorAll(".nav button").forEach(b => b.dataset.tab === state.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  ["now", "browse", "mine"].forEach(t => document.getElementById(`view-${t}`).hidden = t !== state.tab);
  const badge = document.getElementById("mineBadge");
  badge.hidden = picks.size === 0; badge.textContent = picks.size;
  if (!events.length) return;
  if (state.tab === "now") renderNow();
  if (state.tab === "browse") renderBrowse();
  if (state.tab === "mine") renderMine();
  renderMiniBar();
}

function renderMiniBar() {
  const bar = document.getElementById("minibar");
  const next = state.tab === "now" || !events.length ? null : nextPickInConDay(getNow());
  if (!next) {
    bar.hidden = true;
    document.body.classList.remove("has-minibar");
    return;
  }
  const now = getNow();
  const info = leaveInfo(currentLocation(now), next, now);
  const when = info && info.leaveBy
    ? (info.late ? "leave now" : `leave by ${fmtShort(info.leaveBy)}`)
    : `in ${minutesBetween(now, next._s)} min`;
  bar.classList.toggle("late", !!(info && info.late));
  bar.innerHTML = `<span class="mb-body">
      <span class="mb-title">${esc(next.title)}</span>
      <span class="mb-room" style="--h:var(${hotelVar(next.hotel)})">${esc(next.room || next.location || "Location TBA")}</span>
    </span><span class="mb-when">${esc(when)}</span>`;
  bar.setAttribute("aria-label", `Next: ${next.title}, ${when}. Go to Now.`);
  bar.hidden = false;
  document.body.classList.add("has-minibar");
}

function updateClock() {
  const now = getNow();
  const preview = location.hash.includes("now=");
  document.getElementById("clock").textContent = `${DAY_LABEL[dayOf(now)] || now.toLocaleDateString(undefined, {weekday: "short"})} ${fmtShort(now)}` + (preview ? " (preview)" : "");
}

function rowHTML(ev, opts = {}) {
  const s = fmt(ev._s), e = fmt(ev._e);

  const room = ev.room || ev.location || "Location TBA";
  const status = opts.status ? `<span class="status">${esc(opts.status)}</span>` : "";
  const cls = ["row", mine ? "mine" : "", open ? "open" : "", ev.cancelled ? "cancelled" : ""].filter(Boolean).join(" ");
  const hl = opts.terms ? highlighter(opts.terms) : (x => esc(x));
  const snippet = opts.terms ? snippetFor(ev, opts.terms) : "";
  return `<li class="${cls}" data-id="${esc(ev.id)}" data-list="${esc(opts.list || "")}">
    <div class="row-line">
      <button class="row-main" aria-haspopup="dialog">
        <div class="t">${opts.showDay ? `<span class="day">${DAY_LABEL[ev.day] || ""}</span>` : ""}<span class="start">${s.t}<span class="ampm">${s.ap}</span></span><span class="end">to ${e.t} ${e.ap}</span></div>
        <div class="body">
          <div class="title">${hl(ev.title)}</div>
          <div class="meta">
            <span class="room" style="--h:var(${hotelVar(ev.hotel)})">${esc(room)}</span>
            ${status}<span class="track">${esc(ev.track || (ev.type === "gaming" ? "Gaming" : ""))}</span>
          </div>
          ${snippet ? `<div class="snippet">${snippet}</div>` : ""}
        </div>
      </button>
      <button class="star" aria-pressed="${mine}" aria-label="${mine ? "Remove from my schedule" : "Add to my schedule"}">${mine ? "★" : "☆"}</button>
    </div>
  </li>`;
}

function highlighter(terms) {
  const words = [...new Set(terms)].filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return x => esc(x);
  const re = new RegExp(`(${words.join("|")})`, "gi");
  return x => esc(x).replace(re, "<mark>$1</mark>");
}
function snippetFor(ev, terms) {
  const d = ev.description || "";
  const words = [...new Set(terms)].filter(t => t.length > 1);
  let pos = -1;
  for (const w of words) { const i = d.toLowerCase().indexOf(w); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) {
    const who = (ev.speakers || []).map(p => p.name).join(", ");
    if (who && words.some(w => who.toLowerCase().includes(w))) return `With ${highlighter(terms)(who)}`;
    return d ? esc(d.slice(0, 110)) + (d.length > 110 ? "…" : "") : "";
  }
  const start = Math.max(0, pos - 40), end = Math.min(d.length, pos + 100);
  return (start > 0 ? "…" : "") + highlighter(terms)(d.slice(start, end)) + (end < d.length ? "…" : "");
}
function detailHTML(ev) {
  const mine = picks.has(ev.id);
  const people = (ev.speakers || []).map(p => p.role && p.role !== "Speaker" && p.role !== "Panelist" ? `${p.name} (${p.role.toLowerCase()})` : p.name);
  const dur = ev.duration_min ? (ev.duration_min >= 60 ? `${Math.floor(ev.duration_min / 60)} h${ev.duration_min % 60 ? ` ${ev.duration_min % 60} min` : ""}` : `${ev.duration_min} min`) : "";
  return `<div class="detail">
    ${ev.description ? `<p>${esc(ev.description)}</p>` : `<p style="color:var(--muted)">No description.</p>`}
    <div class="kv">
      ${people.length ? `<div>With <span>${esc(people.join(", "))}</span></div>` : ""}
      <div>Where <span>${esc(ev.location || "TBA")}</span></div>
      <div>When <span>${DAY_LONG[ev.day] || ev.day}, ${fmtShort(ev._s)} to ${fmtShort(ev._e)}${dur ? ` (${dur})` : ""}</span></div>
      ${(ev.tracks || []).length ? `<div>Track <span>${esc(ev.tracks.join(", "))}</span></div>` : ""}
      ${ev.type === "gaming" ? `<div>Listed under <span>Gaming events</span></div>` : ""}
    </div>
    ${ev.tags ? `<div class="tagline">${[...(ev.tags.fandoms || []), ev.tags.kind ? KIND_LABELS[ev.tags.kind] || ev.tags.kind : "", ...(ev.tags.topics || [])].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}${ev.tags.adult ? `<span class="tag adult">18+</span>` : ""}</div>` : ""}
    <button class="btn ${mine ? "quiet" : ""}" data-act="toggle">${mine ? "Remove from my schedule" : "Add to my schedule"}</button>
  </div>`;
}

function gapHTML(prev, next) {
  if (!prev || !next || prev.day !== next.day && minutesBetween(prev._e, next._s) > 240) return "";
  const gap = minutesBetween(prev._e, next._s);
  const walk = walkMin(prev.hotel, next.hotel);
  const move = prev.hotel !== next.hotel ? `${hotelShort(prev.hotel)} to ${hotelShort(next.hotel)}` : `same building`;
  if (next._s < prev._e) {
    const ov = minutesBetween(next._s, prev._e);
    return `<div class="gap overlap">Overlaps the one above by ${ov} min</div>`;
  }
  if (gap < walk) return `<div class="gap tight">${gap} min to get there, ${move} is about ${walk} min at con pace</div>`;
  if (gap < walk + 10) return `<div class="gap">${gap} min gap, ${move} about ${walk} min. Tight but doable</div>`;
  return "";
}

/* Schematic venue map. Rough real arrangement, not a survey: Marriott,

const MAP_W = 300, MAP_H = 172;

/* mode "hero": highlight where you are and where you're going, joined by a
   dashed line labelled with the crowd-adjusted walk.
   mode "filter": highlight the selected hotel; everything else is normal. */
function venueMapHTML({mode, current = null, next = null, minutes = null, active = "All"}) {
  const on = h => mode === "filter" ? (active === h) : (h === current || h === next);
  const anyOn = mode === "filter" ? active !== "All" : !!(current || next);
  let link = "";
  if (mode === "hero" && current && next && current !== next) {
    const a = MAP_BLOCKS.find(b => b.hotel === current), b2 = MAP_BLOCKS.find(b => b.hotel === next);
    if (a && b2) {
      const [x1, y1] = mapCentre(a), [x2, y2] = mapCentre(b2);
      /* Nudge the label off the line's midpoint, perpendicular to it, so it
         doesn't land on whichever block the connector happens to cross. */
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const mx = (x1 + x2) / 2 - (dy / len) * 15, my = (y1 + y2) / 2 + (dx / len) * 15;
      link = `<line class="link" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>
        <text class="link-label" x="${mx.toFixed(1)}" y="${(my + 4).toFixed(1)}">${minutes} min</text>`;
    }
  }
  const blocks = MAP_BLOCKS.map(b => {
    const isOn = on(b.hotel);
    const cls = ["blk", isOn ? "on" : "", anyOn && !isOn ? "dim" : ""].filter(Boolean).join(" ");
    const [cx, cy] = mapCentre(b);
    return `<g class="${cls}" data-map="${esc(b.hotel)}" role="button" tabindex="0"
        aria-pressed="${isOn}" aria-label="${esc(hotelShort(b.hotel))}" style="--h:var(${hotelVar(b.hotel)})">
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8"></rect>
      <text x="${cx}" y="${cy}">${esc(hotelShort(b.hotel))}</text>
    </g>`;
  }).join("");
  return `<svg class="venue-map" viewBox="0 0 ${MAP_W} ${MAP_H}" role="group"
      aria-label="${mode === "filter" ? "Filter by hotel" : "Where you are and where you're going"}">${link}${blocks}</svg>`;
}

/* Manual location override: "I'm actually at the Westin".
   Expires when the next pick starts, or after 90 minutes, whichever is first. */
function setOverride(hotel) {
  const cur = loadJSON("dc26.override", null);
  if (cur && cur.hotel === hotel) { saveJSON("dc26.override", null); return; }
  saveJSON("dc26.override", {hotel, at: getNow().getTime()});
}
function overrideLocation(now) {
  const o = loadJSON("dc26.override", null);
  if (!o || !o.hotel || !o.at) return null;
  const setAt = new Date(o.at);
  if (now < setAt || minutesBetween(setAt, now) >= 90) return null;
  const nextAfter = events.find(e => picks.has(e.id) && e._s > setAt);
  if (nextAfter && now >= nextAfter._s) return null;
  return o.hotel;
}
function overrideAgeMin(now) {
  const o = loadJSON("dc26.override", null);
  return o && o.at ? minutesBetween(new Date(o.at), now) : null;
}

/* A con day runs to 5am, so a 1am Sunday panel still belongs to Saturday. */
function conDayKey(d) { return dayOf(new Date(d.getTime() - 5 * 3600000)); }

function nextPickInConDay(now) {
  const key = conDayKey(now);
  return events.find(e => picks.has(e.id) && e._s > now && conDayKey(e._s) === key) || null;
}

/* ---- Where you are, and when to leave ------------------------------ */

/* Step 4 will let you tap a map block to say where you actually are.
   Until then there is no override and this resolves to null. */
function locationOverride(now) {
  return (typeof overrideLocation === "function") ? overrideLocation(now) : null;
}

/* First match wins: manual override, what you're in now, where you just
   were, your home base, or nothing (in which case we can show a walk
   time but not a leave-by, because we don't know where you're walking from). */
function currentLocation(now) {
  const ov = locationOverride(now);
  if (ov) return ov;
  const on = events.find(e => picks.has(e.id) && e._s <= now && now < e._e);
  if (on) return on.hotel;
  const justEnded = events.filter(e => picks.has(e.id) && e._e <= now && minutesBetween(e._e, now) <= 90)
    .sort((a, b) => b._e - a._e)[0];
  if (justEnded) return justEnded.hotel;
  return settings.homeBase || null;
}

function leaveInfo(from, next, now) {
  if (!next) return null;
  const walk = from ? walkMin(from, next.hotel) : null;
  if (walk === null) return {walk: null, leaveBy: null, late: false, next};
  const leaveBy = new Date(next._s.getTime() - (walk + LEAVE_BUFFER_MIN) * 60000);
  return {walk, leaveBy, late: now >= leaveBy, next};
}

const RING_R = 26, RING_C = 2 * Math.PI * RING_R;
function ringHTML(fraction, minutes, late) {
  const f = Math.max(0, Math.min(1, fraction));
  const label = minutes >= 60 ? `${Math.floor(minutes / 60)}h` : `${Math.max(0, minutes)}`;
  return `<div class="ring"><svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
      <circle class="track-c" cx="31" cy="31" r="${RING_R}" fill="none" stroke-width="5"></circle>
      <circle class="prog" cx="31" cy="31" r="${RING_R}" fill="none" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C * (1 - f)).toFixed(1)}"></circle>
    </svg><div class="num">${label}<small>${minutes >= 60 ? "" : "min"}</small></div></div>`;
}

function heroHTML(ev, now, onNow, thenNext) {
  const from = currentLocation(now);
  const room = ev.room || ev.location || "Location TBA";
  let kicker, leaveLine = "", thenLine = "", target, windowStart, late = false;

  if (onNow) {
    kicker = "On now";
    target = ev._e;
    windowStart = ev._s;
    const info = leaveInfo(from, thenNext, now);
    if (info && info.leaveBy) {
      late = info.late;
      thenLine = `<div class="hthen">then: <b>leave by ${fmtShort(info.leaveBy)}</b> for the ${esc(hotelShort(thenNext.hotel))}</div>`;
    } else if (info) {
      thenLine = `<div class="hthen">then: ${esc(hotelShort(thenNext.hotel))} next</div>`;
    }
    leaveLine = `<div class="hleave">ends ${fmtShort(ev._e)}</div>`;
  } else {
    kicker = "Your next";
    const info = leaveInfo(from, ev, now);
    if (info && info.leaveBy) {
      late = info.late;
      target = info.leaveBy;
      windowStart = new Date(info.leaveBy.getTime() - 60 * 60000);
      leaveLine = `<div class="hleave">${late ? "leave now" : `leave by ${fmtShort(info.leaveBy)}`}</div>`;
      thenLine = `<div class="hthen">${info.walk} min walk from the ${esc(hotelShort(from))} &middot; starts ${fmtShort(ev._s)}</div>`;
    } else {
      target = ev._s;
      windowStart = new Date(ev._s.getTime() - 60 * 60000);
      leaveLine = `<div class="hleave">starts ${fmtShort(ev._s)}</div>`;
      thenLine = `<div class="hthen">Set a home base in Settings for a leave-by time</div>`;
    }
  }
  const total = Math.max(1, minutesBetween(windowStart, target));
  const leftMin = minutesBetween(now, target);

  /* The map answers "which way", so it points at wherever we're headed:
     the pick after this one when something is on now, else this pick. */
  const dest = onNow ? (thenNext || null) : ev;
  const mapFrom = from;
  const walkMins = mapFrom && dest ? walkMin(mapFrom, dest.hotel) : null;
  const mapHTML = `<div class="hero-map">${venueMapHTML({
    mode: "hero", current: mapFrom, next: dest ? dest.hotel : null, minutes: walkMins})}</div>`;

  const ovHotel = overrideLocation(now);
  const age = ovHotel ? overrideAgeMin(now) : null;
  const locLine = ovHotel
    ? `<div class="hero-loc">At the <b>${esc(hotelShort(ovHotel))}</b> &middot; set ${age <= 0 ? "just now" : `${age} min ago`} &middot; <button data-act="clear-override">tap to clear</button></div>`
    : "";

  return `<button class="hero${late ? " late" : ""}" data-hero="${esc(ev.id)}">
    ${ringHTML(leftMin / total, leftMin, late)}
    <div class="hbody">
      <div class="hkicker">${kicker}</div>
      <div class="htitle">${esc(ev.title)}</div>
      <div class="hroom" style="--h:var(${hotelVar(ev.hotel)})">${esc(room)}</div>
      ${leaveLine}${thenLine}
    </div>
  </button>${mapHTML}${locLine}`;
}

/* ---- Now ---------------------------------------------------------- */
function renderNow() {
  const real = getNow();
  let now = real, banner = "";
  if (real < new Date("2026-09-02T00:00")) {
    now = new Date("2026-09-03T10:00");
    banner = `<b>Con starts Thursday.</b> Showing Thursday 10:00 AM as a preview. Use Settings to preview any other time.`;
  } else if (real > new Date("2026-09-08T06:00")) {
    banner = `<b>That's a wrap.</b> Showing Monday afternoon.`; now = new Date("2026-09-07T13:00");
  }
  const noticeEl = document.getElementById("notice");
  noticeEl.hidden = !banner; noticeEl.className = "notice"; noticeEl.innerHTML = banner;

  const horizon = new Date(now.getTime() + 60 * 60000);
  const minePlan = events.filter(e => picks.has(e.id) && e._e > now);
  let mineHTML = "";
  if (minePlan.length) {
    const onNowEv = minePlan.find(e => e._s <= now && now < e._e) || null;
    const upcoming = minePlan.filter(e => e._s > now);
    const heroEv = onNowEv || upcoming[0];
    const thenNext = onNowEv ? upcoming[0] : null;
    mineHTML = heroHTML(heroEv, now, !!onNowEv, thenNext);
    const rest = minePlan.filter(e => e !== heroEv);
    if (rest.length) {
      mineHTML += `<div class="section-title">Rest of your day <span class="count">${picks.size} picked</span></div><ul class="list compact">`;
      rest.forEach((ev, i) => {
        const status = ev._s <= now ? `On now, ends ${fmtShort(ev._e)}` : `In ${minutesBetween(now, ev._s)} min`;
        mineHTML += gapHTML(i === 0 ? heroEv : rest[i - 1], ev) + rowHTML(ev, {list: "next", status: minutesBetween(now, ev._s) <= 90 || ev._s <= now ? status : ""});
      });
      mineHTML += `</ul>`;
    }
  } else {
    mineHTML = `<div class="empty"><b>Nothing picked for later today.</b> Star things in Browse and they show up here with walk times.</div>`;
  }

  const around = events.filter(e => e._e > now && e._s <= horizon && !(state.browse.hideNoise && isNoise(e)) && (state.now.hotel === "All" || e.hotel === state.now.hotel));
  const shown = around.slice(0, state.now.limit);
  let aroundHTML = `<div class="section-title">On now and in the next hour <span class="count">${around.length}</span></div>
    <div class="controls" style="padding-top:0"><div class="chips">${chipHTML("All", state.now.hotel === "All", "now-hotel")}${hotels.map(h => chipHTML(hotelShort(h), state.now.hotel === h, "now-hotel", h)).join("")}</div></div><ul class="list compact">`;
  let lastKey = "";
  shown.forEach(ev => {
    const key = ev._s <= now ? "on" : fmtShort(ev._s);
    if (key !== lastKey) { aroundHTML += `<li class="time-head">${key === "on" ? "On now" : "Starts " + key}</li>`; lastKey = key; }
    aroundHTML += rowHTML(ev, {list: "around"});
  });
  aroundHTML += `</ul>`;
  if (around.length > shown.length) aroundHTML += `<button class="btn quiet more" data-act="more-now">Show ${around.length - shown.length} more</button>`;
  if (!around.length) aroundHTML += `<div class="empty">Nothing on in this window${state.now.hotel !== "All" ? " at the " + hotelShort(state.now.hotel) : ""}.</div>`;
  document.getElementById("view-now").innerHTML = mineHTML + aroundHTML;
}

function chipHTML(label, on, kind, value, style) {
  const v = value ?? label;
  const cls = kind.endsWith("hotel") && v !== "All" ? `chip hotel` : `chip`;
  const st = kind.endsWith("hotel") && v !== "All" ? ` style="--h:var(${hotelVar(v)})"` : "";
  return `<button class="${cls}" data-chip="${kind}" data-value="${esc(v)}" aria-pressed="${on}"${st}>${esc(label)}</button>`;
}

/* ---- Browse ------------------------------------------------------- */
function passesFilters(e) {
  const b = state.browse, tg = e.tags || {};
  return (b.day === "All" || e.day === b.day) &&
    (b.hotel === "All" || e.hotel === b.hotel) &&
    (b.type === "All" || e.type === b.type) &&
    (b.track === "All" || (e.tracks || []).includes(b.track)) &&
    (b.fandom === "All" || (tg.fandoms || []).includes(b.fandom)) &&
    (b.kind === "All" || tg.kind === b.kind) &&
    (!b.hideAdult || !tg.adult) &&
    (!b.hideNoise || !isNoise(e));
}
function browseResults() {
  const q = state.browse.q.trim();
  if (!q || !index) return events.filter(passesFilters);
  const nTerms = new Set(q.split(/[\s\p{P}]+/u).map(processTerm).filter(Boolean)).size || 1;
  const out = [];
  for (const h of index.search(q)) {
    const e = byId.get(h.id);
    if (!e || !passesFilters(e)) continue;
    const coverage = new Set(h.queryTerms).size / nTerms;
    e._hit = {score: h.score * (0.5 + coverage), terms: h.terms};
    out.push(e);
  }
  out.sort((a, b) => b._hit.score - a._hit.score || a._s - b._s);
  return out;
}

function renderBrowse() {
  const b = state.browse;
  if (b.day === null) { const d = dayOf(getNow()); b.day = CON_DAYS.includes(d) ? d : "2026-09-03"; }
  const searching = !!b.q.trim();
  const results = browseResults();
  const shown = results.slice(0, PAGE * b.page);
  const noiseCount = events.filter(e => isNoise(e) && (b.day === "All" || e.day === b.day)).length;
  const hasTags = events.some(e => e.tags);
  const fandoms = hasTags ? fandomCounts() : [];
  const kindsPresent = hasTags ? Object.keys(KIND_LABELS).filter(k => events.some(e => e.tags && e.tags.kind === k)) : [];

  let html = `<div class="controls">
    <input class="search" type="search" id="q" placeholder="Search anything: titles, guests, fandoms, words in descriptions" value="${esc(b.q)}" autocomplete="off">
    <div class="chips">${CON_DAYS.map(d => chipHTML(DAY_LABEL[d], b.day === d, "day", d)).join("")}${chipHTML("All days", b.day === "All", "day", "All")}</div>
    <div class="browse-map">${venueMapHTML({mode: "filter", active: b.hotel})}</div>
    ${hasTags ? `<div class="chips">${chipHTML("Any kind", b.kind === "All", "kind", "All")}${kindsPresent.map(k => chipHTML(KIND_LABELS[k], b.kind === k, "kind", k)).join("")}</div>` : ""}
    <div class="row-controls">
      <div class="seg" role="group" aria-label="Type">
        ${["All", "panel", "gaming"].map(t => `<button data-chip="type" data-value="${t}" aria-pressed="${b.type === t}">${{All: "All", panel: "Panels", gaming: "Gaming"}[t]}</button>`).join("")}
      </div>
      ${hasTags ? `<select class="track" id="fandom" aria-label="Fandom"><option value="All">Any fandom</option>${fandoms.map(([f, n]) => `<option value="${esc(f)}" ${b.fandom === f ? "selected" : ""}>${esc(f)} (${n})</option>`).join("")}</select>` : ""}
      <select class="track" id="track" aria-label="Track"><option value="All">All tracks</option>${tracks.map(t => `<option value="${esc(t)}" ${b.track === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    </div>
    <label class="toggle"><input type="checkbox" id="hideNoise" ${b.hideNoise ? "checked" : ""}> Hide photo sessions and video-room screenings${noiseCount ? ` (${noiseCount})` : ""}</label>
    ${hasTags ? `<label class="toggle"><input type="checkbox" id="hideAdult" ${b.hideAdult ? "checked" : ""}> Hide 18+</label>` : ""}
  </div>
  <div class="section-title">${searching ? "Best matches first" : "Results"} <span class="count">${results.length}</span></div><ul class="list">`;

  let lastDay = "", lastTime = "";
  shown.forEach(ev => {
    if (searching) { html += rowHTML(ev, {list: "browse", showDay: true, terms: ev._hit.terms}); return; }
    if (b.day === "All" && ev.day !== lastDay) { html += `<li class="day-head">${DAY_LONG[ev.day] || ev.day}</li>`; lastDay = ev.day; lastTime = ""; }
    const t = fmtShort(ev._s);
    if (t !== lastTime) { html += `<li class="time-head">${t}</li>`; lastTime = t; }
    html += rowHTML(ev, {list: "browse"});
  });
  html += `</ul>`;
  if (!results.length) html += `<div class="empty"><b>No matches.</b> Try fewer or different words, another day, or turn off the photo/video filter.</div>`;
  if (results.length > shown.length) html += `<button class="btn quiet more" data-act="more-browse">Show ${Math.min(PAGE, results.length - shown.length)} more of ${results.length - shown.length}</button>`;
  const view = document.getElementById("view-browse");
  const focused = document.activeElement && document.activeElement.id === "q";
  const pos = focused ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  view.innerHTML = html;
  if (focused) { const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos[0], pos[1]); } catch (e) {} }
}

/* ---- Mine --------------------------------------------------------- */
/* Side-by-side columns for anything that overlaps in time. Events are
   grouped into clusters that genuinely collide, and each cluster is
   given only as many columns as it actually needs. */
const HOUR_PX = 60;
function layoutColumns(list) {
  const sorted = [...list].sort((a, b) => a._s - b._s || a._e - b._e);
  const out = [];
  let cluster = [], clusterEnd = null;
  const flush = () => {
    if (!cluster.length) return;
    const colEnds = [];
    cluster.forEach(it => {
      let c = colEnds.findIndex(end => end <= it.ev._s.getTime());
      if (c === -1) { c = colEnds.length; colEnds.push(0); }
      colEnds[c] = it.ev._e.getTime();
      it.col = c;
    });
    cluster.forEach(it => it.cols = colEnds.length);
    out.push(...cluster);
    cluster = []; clusterEnd = null;
  };
  sorted.forEach(ev => {
    if (clusterEnd !== null && ev._s.getTime() >= clusterEnd) flush();
    cluster.push({ev, col: 0, cols: 1});
    clusterEnd = clusterEnd === null ? ev._e.getTime() : Math.max(clusterEnd, ev._e.getTime());
  });
  flush();
  return out;
}

function timelineDayHTML(dayKey, list, now) {
  const items = layoutColumns(list);
  const sorted = items.map(i => i.ev).sort((a, b) => a._s - b._s);
  const startMs = Math.min(...sorted.map(e => e._s.getTime()));
  const endMs = Math.max(...sorted.map(e => e._e.getTime()));
  const origin = new Date(startMs); origin.setMinutes(0, 0, 0);
  const last = new Date(endMs);
  if (last.getMinutes() || last.getSeconds()) { last.setMinutes(0, 0, 0); last.setHours(last.getHours() + 1); }
  const spanH = Math.max(1, Math.round((last - origin) / 3600000));
  const top = t => ((t - origin) / 60000) * (HOUR_PX / 60);

  let hours = "";
  for (let h = 0; h <= spanH; h++) {
    const at = new Date(origin.getTime() + h * 3600000);
    hours += `<div class="tl-hour" style="top:${h * HOUR_PX}px"><span>${fmtShort(at)}</span></div>`;
  }

  const blocks = items.map(({ev, col, cols}) => {
    const h = Math.max(24, top(ev._e.getTime()) - top(ev._s.getTime()) - 2);
    const w = 100 / cols;
    return `<button class="tl-block" data-hero="${esc(ev.id)}" style="top:${top(ev._s.getTime()).toFixed(1)}px;height:${h.toFixed(1)}px;left:${(col * w).toFixed(2)}%;width:calc(${w.toFixed(2)}% - 3px);--h:var(${hotelVar(ev.hotel)})">
      <span class="tb-title">${esc(ev.title)}</span>
      <span class="tb-room">${esc(ev.room || ev.location || "")}</span>
    </button>`;
  }).join("");

  let links = "";
  for (let i = 1; i < sorted.length; i++) {
    const prev = sorted[i - 1], next = sorted[i];
    if (prev.hotel === next.hotel) continue;
    const walk = walkMin(prev.hotel, next.hotel);
    const gap = minutesBetween(prev._e, next._s);
    const y1 = top(prev._e.getTime()), y2 = top(next._s.getTime());
    const height = Math.max(18, y2 - y1);
    links += `<div class="tl-link${gap < walk ? " tight" : ""}" style="top:${Math.min(y1, y2).toFixed(1)}px;height:${height.toFixed(1)}px">
      <span>${walk} min</span></div>`;
  }

  const nowLine = conDayKey(now) === dayKey && now >= origin && now <= last
    ? `<div class="tl-now" style="top:${top(now.getTime()).toFixed(1)}px"></div>` : "";

  return `<div class="tl-day">
    <div class="day-head" style="padding-left:0">${DAY_LONG[dayKey] || dayKey} <span class="count" style="font-size:14px;color:var(--dim);font-weight:400">${list.length}</span></div>
    <div class="tl-grid" style="height:${spanH * HOUR_PX + 12}px">${hours}${links}${blocks}${nowLine}</div>
  </div>`;
}

function renderMineTimeline(mine, now) {
  const days = new Map();
  mine.forEach(ev => {
    const k = conDayKey(ev._s);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(ev);
  });
  return [...days.keys()].sort().map(k => timelineDayHTML(k, days.get(k), now)).join("");
}

function renderMine() {
  const mine = events.filter(e => picks.has(e.id));
  let html = `<div class="mine-actions">
    <button class="btn" data-act="ics" ${mine.length ? "" : "disabled"}>Export to calendar</button>
    <button class="btn quiet" data-act="clear" ${mine.length ? "" : "disabled"}>Remove all</button>
  </div>`;
  if (mine.length) html += `<div class="view-toggle" role="group" aria-label="View">
    <button data-act="view-timeline" aria-pressed="${state.mineView === "timeline"}">Timeline</button>
    <button data-act="view-list" aria-pressed="${state.mineView === "list"}">List</button>
  </div>`;
  if (!mine.length) {
    html += `<div class="empty"><b>Nothing picked yet.</b> Star things in Browse. They'll line up here by day with warnings when two picks overlap or the walk between hotels is too tight.</div>`;
  } else if (state.mineView === "timeline") {
    html += renderMineTimeline(mine, getNow());
  } else {
    html += `<ul class="list">`;
    let lastDay = "", prev = null;
    mine.forEach(ev => {
      if (ev.day !== lastDay) { html += `<li class="day-head">${DAY_LONG[ev.day] || ev.day} <span class="count" style="font-size:14px;color:var(--dim);font-weight:400">${mine.filter(x => x.day === ev.day).length}</span></li>`; lastDay = ev.day; prev = null; }
      html += gapHTML(prev, ev) + rowHTML(ev, {list: "mine"});
      prev = ev;
    });
    html += `</ul>`;
  }
  document.getElementById("view-mine").innerHTML = html;
}

/* ==================================================================
   Calendar export (.ics)
   ================================================================== */
function icsEscape(s) { return String(s ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function fold(line) { const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = " " + line.slice(74); } out.push(line); return out.join("\r\n"); }
function icsDate(d) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
function exportICS() { downloadICS(events.filter(e => picks.has(e.id)), "dragoncon-2026-my-schedule.ics"); }
function exportEventICS(ev) {
  downloadICS([ev], `dragoncon-2026-${(ev.title || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "event"}.ics`);
}
function downloadICS(mine, filename) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//dragoncon-planner//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Dragon Con 2026",
    "BEGIN:VTIMEZONE", "TZID:America/New_York",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:-0500", "TZOFFSETTO:-0400", "TZNAME:EDT", "DTSTART:19700308T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:-0400", "TZOFFSETTO:-0500", "TZNAME:EST", "DTSTART:19701101T020000", "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU", "END:STANDARD",
    "END:VTIMEZONE"];
  mine.forEach(ev => {
    const who = (ev.speakers || []).map(p => p.name).join(", ");
    const desc = [ev.description, who ? `With: ${who}` : "", ev.track ? `Track: ${ev.track}` : ""].filter(Boolean).join("\n");
    lines.push("BEGIN:VEVENT", `UID:dc26-${ev.id}@dragoncon-planner`, `DTSTAMP:${stamp}`,
      `DTSTART;TZID=America/New_York:${icsDate(ev._s)}`, `DTEND;TZID=America/New_York:${icsDate(ev._e)}`,
      fold(`SUMMARY:${icsEscape(ev.title)}`), fold(`LOCATION:${icsEscape(ev.location)}`), fold(`DESCRIPTION:${icsEscape(desc)}`), "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n") + "\r\n"], {type: "text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

/* ==================================================================
   Events (the DOM kind)
   ================================================================== */
document.querySelector(".nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});

document.querySelector("main").addEventListener("click", e => {
  const chip = e.target.closest("[data-chip]");
  if (chip) {
    const {chip: kind, value} = chip.dataset;
    if (kind === "now-hotel") { state.now.hotel = value; state.now.limit = 80; }
    else if (kind === "day") state.browse.day = value;
    else if (kind === "hotel") state.browse.hotel = value;
    else if (kind === "type") state.browse.type = value;
    else if (kind === "kind") state.browse.kind = value;
    state.browse.page = 1; render(); return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "more-now") { state.now.limit += 100; render(); }
    if (a === "more-browse") { state.browse.page++; render(); }
    if (a === "ics") exportICS();
    if (a === "clear" && confirm("Remove everything from my schedule?")) { picks = new Set(); savePicks(); render(); }
    if (a === "toggle") { const li = act.closest(".row"); togglePick(li.dataset.id); }
    if (a === "clear-override") { saveJSON("dc26.override", null); render(); }
    if (a === "view-timeline" || a === "view-list") {
      state.mineView = a === "view-timeline" ? "timeline" : "list";
      saveJSON("dc26.mineView", state.mineView); render();
    }
    return;
  }
  const star = e.target.closest(".star");
  if (star) { togglePick(star.closest(".row").dataset.id); return; }
  const blk = e.target.closest("[data-map]");
  if (blk) {
    const h = blk.dataset.map;
    if (blk.closest(".browse-map")) { state.browse.hotel = state.browse.hotel === h ? "All" : h; state.browse.page = 1; }
    else setOverride(h);
    render();
    return;
  }
  const hero = e.target.closest("[data-hero]");
  if (hero) { openSheet("event", hero.dataset.hero); return; }
  const main = e.target.closest(".row-main");
  if (main) openSheet("event", main.closest(".row").dataset.id);
});

function togglePick(id) {
  if (picks.has(id)) picks.delete(id); else picks.add(id);
  savePicks(); render();
}

document.querySelector("main").addEventListener("input", e => {
  if (e.target.id === "q") {
    const was = state.browse.q.trim(), now = e.target.value;
    state.browse.q = now;
    if (!was && now.trim()) { state.browse.prevDay = state.browse.day; state.browse.day = "All"; }
    else if (was && !now.trim() && state.browse.prevDay) { state.browse.day = state.browse.prevDay; state.browse.prevDay = null; }
    state.browse.page = 1; renderBrowse();
  }
});
document.querySelector("main").addEventListener("change", e => {
  if (e.target.id === "track") { state.browse.track = e.target.value; state.browse.page = 1; render(); }
  if (e.target.id === "fandom") { state.browse.fandom = e.target.value; state.browse.page = 1; render(); }
  if (e.target.id === "hideAdult") { state.browse.hideAdult = e.target.checked; state.browse.page = 1; render(); }
  if (e.target.id === "hideNoise") { state.browse.hideNoise = e.target.checked; state.browse.page = 1; render(); }
});

/* Bottom sheet: one wrapper, two panels (settings, event) */
const sheetWrap = document.getElementById("sheetWrap");
const sheetEl = document.getElementById("sheet");
const panelSettings = document.getElementById("panel-settings");
const panelEvent = document.getElementById("panel-event");
let sheetScrollY = 0;

function fillSettings() {
  document.getElementById("crowd").value = settings.crowd;
  document.getElementById("crowdLabel").textContent = `${settings.crowd.toFixed(1)}x`;
  document.getElementById("noiseDefault").checked = settings.hideNoise;
  const hb = document.getElementById("homeBase");
  hb.innerHTML = `<option value="">No home base</option>` + hotels.filter(h => WALK[`${h}|Marriott`] || WALK[`Marriott|${h}`] || h === "Marriott")
    .map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join("");
  hb.value = settings.homeBase || "";
  const m = location.hash.match(/now=([0-9T:-]+)/);
  document.getElementById("previewTime").value = m ? m[1].slice(0, 16) : "";
  document.getElementById("walkTable").innerHTML = Object.entries(WALK).map(([k, v]) => `<tr><td>${esc(k.replace("|", " to "))}</td><td>${v}</td></tr>`).join("");
}

function eventSheetHTML(ev) {
  const mine = picks.has(ev.id);
  const people = (ev.speakers || []).map(p => p.role && p.role !== "Speaker" && p.role !== "Panelist" ? `${p.name} (${p.role.toLowerCase()})` : p.name);
  const dur = ev.duration_min ? (ev.duration_min >= 60 ? `${Math.floor(ev.duration_min / 60)} h${ev.duration_min % 60 ? ` ${ev.duration_min % 60} min` : ""}` : `${ev.duration_min} min`) : "";
  const chips = [...(ev.tracks || []), ...((ev.tags && ev.tags.fandoms) || [])];
  return `<div class="ev-head">
      <h2 id="sheetTitleEvent">${esc(ev.title)}</h2>
      <div class="ev-when">${DAY_LONG[ev.day] || ev.day}, ${fmtShort(ev._s)} to ${fmtShort(ev._e)}${dur ? ` &middot; ${dur}` : ""}</div>
      <div class="ev-room" style="--h:var(${hotelVar(ev.hotel)})">${esc(ev.room || ev.location || "Location TBA")}</div>
    </div>
    <div class="ev-body">
      ${ev.description ? `<p>${esc(ev.description)}</p>` : `<p style="color:var(--muted)">No description.</p>`}
      ${people.length ? `<div class="ev-people">With <span>${esc(people.join(", "))}</span></div>` : ""}
      ${chips.length || (ev.tags && ev.tags.adult) ? `<div class="tagline">${chips.map(t => `<span class="tag">${esc(t)}</span>`).join("")}${ev.tags && ev.tags.adult ? `<span class="tag adult">18+</span>` : ""}</div>` : ""}
    </div>
    <div class="ev-actions">
      <button class="ev-star" id="sheetStar" aria-pressed="${mine}" aria-label="${mine ? "Remove from my schedule" : "Add to my schedule"}">${mine ? "★" : "☆"}</button>
      <button class="btn quiet" id="sheetICS">Add this to calendar</button>
      <button class="btn" id="closeSheetEvent">Done</button>
    </div>`;
}

function openSheet(kind = "settings", id = null) {
  sheetScrollY = window.scrollY || window.pageYOffset || 0;
  const isEvent = kind === "event";
  if (isEvent) {
    const ev = byId.get(id);
    if (!ev) return;
    state.sheetId = id;
    panelEvent.innerHTML = eventSheetHTML(ev);
  } else {
    state.sheetId = null;
    fillSettings();
  }
  panelSettings.hidden = isEvent;
  panelEvent.hidden = !isEvent;
  sheetEl.setAttribute("aria-labelledby", isEvent ? "sheetTitleEvent" : "sheetTitle");
  sheetEl.style.transform = "";
  sheetWrap.hidden = false;
}

function closeSheet() {
  sheetWrap.hidden = true;
  state.sheetId = null;
  sheetEl.style.transform = "";
  render();
  window.scrollTo(0, sheetScrollY);
}

/* Swipe down to dismiss */
let dragY = null;
sheetEl.addEventListener("touchstart", e => {
  if (e.target.closest(".ev-body")) return;   // let the description scroll
  dragY = e.touches[0].clientY;
}, {passive: true});
sheetEl.addEventListener("touchmove", e => {
  if (dragY === null) return;
  const dy = e.touches[0].clientY - dragY;
  if (dy > 0) sheetEl.style.transform = `translateY(${dy}px)`;
}, {passive: true});
sheetEl.addEventListener("touchend", e => {
  if (dragY === null) return;
  const dy = (e.changedTouches[0].clientY - dragY);
  dragY = null;
  if (dy > 90) closeSheet(); else sheetEl.style.transform = "";
});

panelEvent.addEventListener("click", e => {
  if (e.target.closest("#closeSheetEvent")) { closeSheet(); return; }
  const ev = byId.get(state.sheetId);
  if (!ev) return;
  if (e.target.closest("#sheetICS")) { exportEventICS(ev); return; }
  if (e.target.closest("#sheetStar")) {
    if (picks.has(ev.id)) picks.delete(ev.id); else picks.add(ev.id);
    savePicks();
    panelEvent.innerHTML = eventSheetHTML(ev);
  }
});

document.querySelector("main").addEventListener("keydown", e => {
  const blk = e.target.closest && e.target.closest("[data-map]");
  if (blk && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); blk.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});
document.getElementById("minibar").addEventListener("click", () => { state.tab = "now"; render(); window.scrollTo(0, 0); });
document.getElementById("settingsBtn").addEventListener("click", () => openSheet("settings"));
document.getElementById("closeSheet").addEventListener("click", closeSheet);
document.getElementById("sheetBack").addEventListener("click", closeSheet);
document.getElementById("crowd").addEventListener("input", e => { settings.crowd = parseFloat(e.target.value); document.getElementById("crowdLabel").textContent = `${settings.crowd.toFixed(1)}x`; saveJSON("dc26.settings", settings); });
document.getElementById("homeBase").addEventListener("change", e => { settings.homeBase = e.target.value; saveJSON("dc26.settings", settings); });
document.getElementById("noiseDefault").addEventListener("change", e => { settings.hideNoise = e.target.checked; state.browse.hideNoise = settings.hideNoise; saveJSON("dc26.settings", settings); });
document.getElementById("applyPreview").addEventListener("click", () => { const v = document.getElementById("previewTime").value; if (v) location.hash = `now=${v}`; state.browse.day = null; closeSheet(); });
document.getElementById("clearPreview").addEventListener("click", () => { history.replaceState(null, "", location.pathname); state.browse.day = null; closeSheet(); });
document.getElementById("resetPicks").addEventListener("click", () => { if (confirm("Remove everything from my schedule?")) { picks = new Set(); savePicks(); closeSheet(); } });
window.addEventListener("hashchange", () => { state.browse.day = null; render(); });

setInterval(() => { updateClock(); if (state.tab === "now" && sheetWrap.hidden) renderNow(); else renderMiniBar(); updateFresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

load();
</script>
</body>
</html>
