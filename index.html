<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Build stamps, empty in the source. build.py fills them in for a channel
     (the next site); main publishes the source as it is and stays unmarked. -->
<meta name="dc-channel" content="">
<meta name="dc-build" content="">
<!-- Link previews in chats, first in the head so every previewer finds them
     before it stops reading: a card with the mark beats a bare URL. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dragon Con 2026 planner">
<meta property="og:title" content="Dragon Con 2026 planner">
<meta property="og:description" content="Search every Dragon Con panel and game, star what you want, and get walk-time warnings between hotels.">
<meta property="og:url" content="https://kilgoretrout853.github.io/dragoncon-planner/">
<meta property="og:image" content="https://kilgoretrout853.github.io/dragoncon-planner/og-image.png">
<meta property="og:image:secure_url" content="https://kilgoretrout853.github.io/dragoncon-planner/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DC26 mark beside the words Dragon Con 2026 planner">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dragon Con 2026 planner">
<meta name="twitter:description" content="Search every Dragon Con panel and game, star what you want, and get walk-time warnings between hotels.">
<meta name="twitter:image" content="https://kilgoretrout853.github.io/dragoncon-planner/og-image.png">
<meta name="theme-color" content="#171A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Opaque, not translucent. On iOS 26 a translucent status bar gives the
     home-screen app a web view that starts under the status bar but is
     short by its height, leaving a dead strip at the bottom of the screen
     that nothing can draw into; the nav then floated a thumb above the
     home indicator on every tab. Opaque puts the web view below the bar
     and runs it to the bottom edge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dragon Con 2026 planner</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- iOS does not accept SVG here; without a PNG the home-screen icon is a
     screenshot of the page. The PNGs come from make_icons.py. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="DC26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-text">
    <div class="brand" id="brand">Dragon Con 2026</div>
    <div class="hdr-line"><span class="clock" id="clock">…</span><span class="fresh" id="fresh"></span><button class="sim-chip" id="simChip" hidden aria-label="Simulated time. Tap to use the real clock">simulated time <span aria-hidden="true">&times;</span></button></div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section class="view" id="view-now"></section>
  <section class="view" id="view-browse" hidden></section>
  <section class="view" id="view-explore" hidden></section>
  <section class="view" id="view-map" hidden></section>
  <section class="view" id="view-mine" hidden></section>
</main>

<button class="update-pill" id="updatePill" hidden>Schedule updated &middot; tap to refresh</button>

<button class="minibar" id="minibar" hidden></button>

<nav class="nav" aria-label="Sections">
  <button data-tab="now" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now
  </button>
  <button data-tab="browse">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search
  </button>
  <button data-tab="explore">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Explore
  </button>
  <button data-tab="map">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map
  </button>
  <button data-tab="mine" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Mine
    <span class="badge" id="mineBadge" hidden>0</span>
  </button>
</nav>

<div id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle" id="sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-panel" id="panel-settings">
    <h2 id="sheetTitle">Settings</h2>
    <label>Crowd factor for walk estimates: <b id="crowdLabel"></b>
      <input type="range" id="crowd" min="1" max="2.5" step="0.1">
    </label>
    <label class="toggle"><input type="checkbox" id="noiseDefault"> Hide photo sessions and video-room screenings by default</label>
    <label class="toggle"><input type="checkbox" id="bigText"> Larger text</label>
    <details class="advanced" id="advanced">
      <summary>Advanced</summary>
      <div class="advanced-body">
        <label>Preview a different time (leave blank to use the real clock)
          <input type="datetime-local" id="previewTime">
        </label>
        <div class="rowbtns">
          <button class="btn quiet" id="applyPreview">Apply preview time</button>
          <button class="btn quiet" id="clearPreview">Use real time</button>
        </div>
        <details>
          <summary style="color:var(--muted);cursor:pointer">Walk-time defaults (minutes, before crowd factor)</summary>
          <table class="walk-table" id="walkTable"></table>
        </details>
        <div class="device" id="deviceLine"></div>
      </div>
    </details>
    <div class="keep" id="keep" hidden></div>
    <div class="rowbtns">
      <button class="btn" id="closeSheet">Done</button>
    </div>
    <div class="rowbtns">
      <button class="btn danger" id="resetPicks">Remove all picks</button>
    </div>
    </div>
    <div class="sheet-panel" id="panel-event" hidden></div>
    <div class="sheet-panel" id="panel-hotel" hidden></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
